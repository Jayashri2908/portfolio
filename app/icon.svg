<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#000000" />
  <g filter="url(#glow)">
    <rect x="20" y="20" width="24" height="24" fill="none" stroke="#00F0FF" stroke-width="2" transform="rotate(45 32 32)" />
    <rect x="27" y="27" width="10" height="10" fill="#00F0FF" transform="rotate(45 32 32)" />
    <rect x="8" y="31" width="8" height="2" fill="#FF6B1A" />
    <rect x="48" y="31" width="8" height="2" fill="#FF6B1A" />
  </g>
</svg>
